<!DOCTYPE html>
<html>
<head>
    <title>Firebase Connection Test</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">

    <h2>Firebase Connection Test</h2>
    <p id="status" style="color: blue;">Firebase සම්බන්ධ වෙමින් පවතී...</p>
    
    <button onclick="testDatabase()" style="padding: 10px 20px; cursor: pointer;">
        Send Test Data to Database
    </button>

    <script>
        // ඔබේ Config එක මෙතනට දාන්න
        const firebaseConfig = {
            apiKey: "AIzaSyCyAQe4T-fNyAwkB0FaeeNLa9qklWgMGMM",
            authDomain: "ezvinet-fa366.firebaseapp.com",
            databaseURL: "https://ezvinet-fa366-default-rtdb.firebaseio.com",
            projectId: "ezvinet-fa366",
            appId: "1:996355935931:web:03f1b16b898c5afb5fe39e"
        };

        // Firebase Initialize කිරීම
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // සම්බන්ධතාවය පරීක්ෂා කිරීම
        const statusElement = document.getElementById('status');
        
        function testDatabase() {
            statusElement.innerText = "දත්ත යවමින් පවතී...";
            
            // Database එකේ 'test_connection' කියන තැනට වෙලාව සේව් කිරීම
            db.ref('test_connection').set({
                message: "Firebase is working!",
                time: new Date().toLocaleString()
            })
            .then(() => {
                statusElement.innerText = "✅ සාර්ථකයි! Firebase වැඩ කරනවා.";
                statusElement.style.color = "green";
                alert("Database එකට දත්ත සාර්ථකව ඇතුළත් කළා!");
            })
            .catch((error) => {
                statusElement.innerText = "❌ අසාර්ථකයි: " + error.message;
                statusElement.style.color = "red";
                console.error(error);
            });
        }
    </script>
</body>
</html>
